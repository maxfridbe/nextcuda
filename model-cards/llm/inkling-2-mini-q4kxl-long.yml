# Inkling-2-Mini UD-Q4_K_XL over the two 12 GB cards, the longest context: the same files as inkling-2-mini-q4kxl
# model card (model-cards/README.md): `--ctx max` - the engine plans for the most tokens the two cards hold (the loop's
# layers on the 5070 and only as many neighbours as leave the cache its room), then measures what the cards have free
# and serves one session of that (a load that cannot hold it is refused: 409); the attention cache in q8
# (NS_INK2_KV=q8: 136 bytes a head's row against 256). docs/ports/inkling2.md has the measurements.
id: inkling-2-mini-q4kxl-long
kind: llm
arch: inkling2_loop
license: apache-2.0
commercial: true
license_note: 'Thinking Machines'' Inkling 2 Mini (Apache-2.0); Unsloth''s GGUF (Mainline_Support layout, the same tensors as its root files) under the same terms.'
title: Inkling-2-Mini UD-Q4_K_XL, long (two cards, 256K, q8 cache)
about: 'The files of inkling-2-mini-q4kxl with 262,144 tokens of context (the RTX 5070 and RTX 3060 together hold more; checked at load from the memory they report): the attention cache as q8, no drafter. Both cards are full while it runs.'
gpus: '1,0'
split: true
vram_gib: 11.3
split_vram_gib: 11.2
ctx: 'max:262144'                # the most the cards hold, at most 262,144 (Thinking Machines' context for it; its GGUF says 1M):
                                 # they hold 296,960 with the q8 cache and no drafter (215,040 with the drafter: it stays off)
tools: true
tasks: true
env:
  NS_PARALLEL: '1'
  NS_INK2_KV: q8
  NS_INK2_DRAFTS: '0'            # no drafter: its own cache (half, ~4 KiB a token) and weights take ~1.3 GiB of the 3060
silo:
  name: inkling2
  required: true                 # the q8 cache is read by the silo's attention
files:
  model: ink2-mini-q4kxl
guide: guides/inkling2.md
