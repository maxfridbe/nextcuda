  draft:                         # the DSpark drafter (found beside the model): up to 5 drafts a step (p 0.8 gate), verified exactly
    key: ink2-mini-dspark-q8
    url: https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/45fd08764f2b0bf16b03a5483a80e5c7aaec8772/dspark-Inkling-2-Mini-Q8_0.gguf
