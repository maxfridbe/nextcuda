# ZONOS3-Mini (Zyphra: multilingual speech at 44.1 kHz in preset voices or a voice cloned from a recording; steering)
# model card (model-cards/README.md): what `nextcuda models search | pull` offers and what the registry entry gets.
# The files are Zyphra's own GGUF conversions (Zyphra/ZONOS3-Mini, gguf/, pinned at d2d142a8): the backbone (Q4_0
# experts, Q8_0 mixers, the tokenizer, condition tables and the codec's silence frame inside), the ZAC codec's MR-iSTFT
# decoders (keep2_plain, the default; full_mr, loaded on the first request that names it), the MECT-B2 speaker
# encoder, the steering bundle, and the 27 preset voices' codes (.codes.npy: the reference prefix, the model's default)
# and speaker embeddings (.embedding.npy). Apache-2.0 (the weights; the runtime this port follows is MIT).
id: zonos3-mini
kind: audio
arch: zonos3
title: 'ZONOS3-Mini (speech in 43 languages at 44.1 kHz: 27 preset voices, a voice cloned from a recording, steering of pace and emotion)'
about: 'Zyphra''s ZONOS3-Mini in Rust and CUDA: an 11-layer backbone of 1024 (gated DeltaNet mixers with a global-attention layer in four, Full AttnRes instead of the residual stream, a top-2-of-64 latent MoE) reads SuperBPE text after a voice and writes ten 4096-code books at 15 Hz; the ZAC codec''s MR-iSTFT decoder makes 44.1 kHz. Voices: a preset (voice: savannah, rupert, ...; its shipped codes as a reference prefix, or option speaker-mode embedding), or a recording (ref_audio, a saved voice) cloned by the MECT-B2 speaker encoder''s embedding. options: controls (steering: delivery.tempo, emotions.*, mood.*, delivery.whisper ...), speaking-rate, decoder full, temperature; cfg is speaker guidance (1: off)'
license: apache-2.0
commercial: true
gpus: '0'
vram_gib: 2.5                    # measured on the 5070: 2.1 GiB at the peak of a 53 s take (the backbone 0.8, the decoder 0.7)
headroom_gib: 1.0                # a long take's decoder activations and the speaker encoder's (a minute of recording)
speech:
- voices
- clone
defaults:
  seconds: 60.0
  cfg: 1.0
env: {}
