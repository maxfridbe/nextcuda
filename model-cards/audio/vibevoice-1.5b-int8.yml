vram_gib: 4.2
speech:
- clone
- speakers
defaults:
  seconds: 600.0
  steps: 10
  cfg: 1.3
env:
  NS_VV_INT8: '1'
files:
  model: vv-model-bf16
  config: vv-config
  tokenizer: vv-tokenizer
guide: guides/vibevoice.md
