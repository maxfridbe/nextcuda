# Qwen-Image 2.1 Q6_K (text to image, RGBA, edits; Rust + CUDA)
# model card (model-cards/README.md): what `nextcuda models search | pull` offers and what the registry entry gets.
# Files: the GGUF transformer, Qwen3-VL as a GGUF (+ its projector for edits), the VAE.
id: qwen-image-2.1-q6k
kind: image
arch: qwen-image-2.1
license: qwen-research
commercial: false
license_note: 'Qwen Research Licence: the weights may be used for non-commercial purposes only (research or evaluation); commercial use needs a separate licence from Qwen.'
title: 'Qwen-Image 2.1 Q6_K (text to image, RGBA, edits; Rust + CUDA)'
about: 'The same model with a Q6_K transformer (6.0 GB): for the 12 GB cards that also hold the text encoder'
gpus: '0'
vram_gib: 10.0                 # the Rust engine keeps the transformer on the card, with the VAE and 1024x1024's activations
defaults:
  steps: 40
  cfg: 4.0
  sampler: euler
  schedule: shift
  size: 1024x1024
env: {}
files:
  transformer:
    key: qwen-image-21-q6k
    url: https://huggingface.co/leejet/Qwen-Image-2.1-GGUF/resolve/cc11433936a06e9765f7c0c0b1f0436cfd2b9856/qwen_image_2.1-Q6_K.gguf
    size: 5996851232
    sha256: 1c51d1a8e6cf2b215719dea0c4f0f4cbfff9214a1c7571e57913f57d6a9c3c12
    path: qwen-image-2.1/diffusion_models/qwen_image_2.1-Q6_K.gguf
  text-encoder: qwen-image-21-llm-q4km
  llm-vision: qwen-image-21-llm-mmproj
  vae: qwen-image-21-vae
guide: guides/qwen-image-2.1.md

# The request rules the platform's image control enforces (docs/models.md "Image controls", schema 1); system.models
# carries them on this model's row. Checked against the Rust engine (image/qwenimage21/src/rust/mod.rs): it takes any
# step count, but under 20 the full model stops half made (c989bf51: 6 steps, hazy) - 20 is the least offered; cfg above 1 guides against the negative prompt, or an empty one (" ") when none is given - no negative needed (cfg <= 1: none, the negative unread), sides multiples of 16; an
# edit's strength below 1 needs reference false (with reference it is ignored); the server never passes a mask.
controls:
  version: 1
  steps: {min: 20, max: 100, default: 40}
  cfg: {min: 1, max: 30, default: 4}
  negative: true
  size: {min_side: 256, max_side: 4096, multiple: 16, max_pixels: 4194304, default: 1024x1024}
  seed: true
  n: 8
  loras: true
  edit: {images: 8, mask: false, strength: true, reference: true, strength_with_reference: false}
  transparent: true

