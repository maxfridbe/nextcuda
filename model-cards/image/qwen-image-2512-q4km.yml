# The request rules the platform's image control enforces (docs/models.md "Image controls", schema 1). The engine
# (image/qwenimage21/src/q2512/mod.rs): under 20 steps the Lightning LoRA (4 by default, guidance 1), 20 or more a full
# guided run; cfg above 1 guides against the negative prompt, or an empty one (" ") when none is given; no pictures (edits() is false) and no alpha.
controls:
  version: 1
  steps: {min: 1, max: 100, default: 4}
  cfg: {min: 1, max: 30, default: 1}
  negative: true
  size: {min_side: 256, max_side: 4096, multiple: 16, max_pixels: 4194304, default: 1024x1024}
  seed: true
  n: 8
  loras: true
  edit: null
  transparent: false
  note: 'under 20 steps the Lightning LoRA (no guidance); 20 or more a full guided run (30 and cfg 4 are the full defaults)'
