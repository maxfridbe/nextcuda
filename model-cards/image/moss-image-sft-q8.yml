# The files are unsloth's GGUFs (the DiT Q8_0, the text encoder Qwen3.5-9B Q8_0) and OpenMOSS's VAE (FLUX.2's small
# decoder, as the pipeline ships it).
id: moss-image-sft-q8
kind: image
