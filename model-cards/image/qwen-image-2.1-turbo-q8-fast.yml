# Fast mode: the same files as qwen-image-2.1-turbo-q8, the DiT's block matrices as int8 ConvRot (NS_QI_INT8=1, the card's int8
# tensor cores). 2048x2048 on the 5070: turbo 30.1 -> 24.2 s, full 77.0 -> 61.5 s (2026-11-14). The pictures differ
# from qwen-image-2.1-turbo-q8's at the same seed: turbo by fine detail (PSNR 33-38 dB), the full model can change the layout.
# Qwen-Image 2.1 Turbo Q8_0 (Viggle v0.3: 6 steps, no guidance; Rust + CUDA)
# model card (model-cards/README.md): what `nextcuda models search | pull` offers and what the registry entry gets.
# Viggle's few-step distill merged into the base transformer (fp32, then Q8_0), the Q8 card's text encoder, projector
# and VAE. It runs on the Rust engine, which samples the distill's own 6 sigmas with the
# size's shift - nextsycl's turbo card's schedule.
id: qwen-image-2.1-turbo-q8-fast
kind: image
arch: qwen-image-2.1
license: qwen-research
commercial: false
license_note: 'Qwen Research Licence: the weights may be used for non-commercial purposes only (research or evaluation); commercial use needs a separate licence from Qwen.'
title: 'Qwen-Image 2.1 Turbo Q8_0 (fast mode, int8; Viggle v0.3: 6 steps, no guidance; Rust + CUDA)'
about: 'Viggle''s Qwen-Image-2.1 turbo v0.3 (6 steps at cfg 1) merged into the base transformer, then Q8_0; the base model''s Qwen3-VL text encoder, projector and VAE; its 6 sigmas with the size''s shift. The transformer stays on the card (Rust engine): a card with about 11 GiB free. Fast mode: int8 matrices, 20-40% quicker; the same seed gives a slightly different picture'
gpus: '0'
vram_gib: 11.0                 # the Rust engine keeps the 7.2 GiB transformer on the card, with the VAE and 1024x1024's activations
defaults:
  steps: 6
  cfg: 1.0
  sampler: euler
  schedule: shift
  size: 1024x1024
env:
  NS_QI_INT8: '1'
  NS_QI_SIGMAS: 1,0.9375,0.875,0.75,0.5,0.25
  NS_QI_SIGMA_SHIFT: dynamic
files:
  transformer: qwen-image-21-turbo-q80
  text-encoder: qwen-image-21-llm-q4km
  llm-vision: qwen-image-21-llm-mmproj
  vae: qwen-image-21-vae
guide: guides/qwen-image-2.1.md

# The request rules the platform's image control enforces (docs/models.md "Image controls", schema 1); system.models
# carries them on this model's row. The Rust engine runs the card's own 6 sigmas and refuses any other count
# (image/qwenimage21/src/rust/mod.rs: "this model runs its own 6 sigmas"); the distill is made for cfg 1, so guidance
# and the negative prompt are not offered.
controls:
  version: 1
  steps: {min: 6, max: 6, default: 6}
  cfg: null
  negative: false
  size: {min_side: 256, max_side: 4096, multiple: 16, max_pixels: 4194304, default: 1024x1024}
  seed: true
  n: 8
  loras: true
  edit: {images: 8, mask: false, strength: true, reference: true, strength_with_reference: false}
  transparent: true
  note: 'fast mode (int8): quicker; the same seed gives a slightly different picture than qwen-image-2.1-turbo-q8'
