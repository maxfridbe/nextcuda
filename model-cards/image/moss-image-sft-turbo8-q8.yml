# MOSS-Image SFT Turbo 8 Q8_0 (8 steps, no guidance; text to image; Rust + CUDA)
# model card (model-cards/README.md): what `nextcuda models search | pull` offers and what the registry entry gets.
# moss-image-sft-q8's files and an 8-step distillation LoRA (fp32, rank 128) merged into the DiT at load before its
# matrices are made int8, as moss-image-sft-turbo4-q8; NS_MOSS_STEPS makes 8 its default.
id: moss-image-sft-turbo8-q8
kind: image
arch: moss-image
license: apache-2.0
commercial: true
title: 'MOSS-Image SFT Turbo 8 Q8_0 (8 steps, no guidance; text to image; Rust + CUDA)'
about: 'MOSS-Image-SFT with lodestones'' MOSS-Image-SFT-8-steps-dmd LoRA (Apache-2.0; data-space DMD of the 50-step guided SFT model, update 2600) merged at load: 8 steps at cfg 1, about 5 s a 1024 x 1024 picture; warm, contrasty, crisp text'
gpus: '0,1'
split: true                      # as moss-image-sft-q8: the DiT and the VAE on the first card, the text encoder on the second
vram_gib: 7.0
defaults:
  steps: 8
  cfg: 1.0
  sampler: euler
  schedule: shift
  size: 1024x1024
env:
  NS_MOSS_STEPS: '8'
files:
  transformer: moss-image-sft-q80
  text-encoder: qwen35-9b-q80
  vae: moss-image-sft-vae
  turbo-lora:
    key: moss-image-sft-8step-dmd-lora
    url: https://huggingface.co/lodestones/MOSS-Image-SFT-8-steps-dmd/resolve/f95df83b5e90ae91ea412434b3f9b7f1c8c6314f/lora.safetensors
    size: 1189176800
    sha256: 4abb14e39c1a59018907581e609f43616ec6810126144ec2b1d2e6f8969628fe
    path: moss-image-sft/loras/moss_image_sft_8step_dmd.safetensors
guide: guides/moss-image.md
