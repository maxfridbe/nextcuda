# Z-Image-Turbo (Tongyi-MAI): few-step text to image - Z-Image's 6B single-stream DiT, 8 steps, no guidance
# model card (model-cards/README.md): what `nextcuda models pull` offers and what the registry entry gets.
# The DiT is unsloth's Q8_0 GGUF of Tongyi-MAI's transformer (the 30 blocks Q8_0, the refiners, embedders, final layer
# and pad tokens bfloat16 / float32 - checked by range reads against the official weights: the float tensors equal,
# the Q8_0 rows 0.55% off as Q8_0 is; jayn7's Q8_0 is the same file), the text encoder Qwen's own Q8_0 GGUF of
# Qwen3-4B (Z-Image's text_encoder is Qwen3-4B: the same shards, only the unused last layer's MLP differs; its first
# 35 layers are run), the VAE and the tokenizer Tongyi-MAI's files at the release's revision.
id: z-image-turbo
kind: image
arch: z-image
license: apache-2.0
commercial: true
title: 'Z-Image-Turbo (text to image in 8 steps, strong at text in pictures; Rust + CUDA)'
about: 'Tongyi-MAI''s Z-Image-Turbo (Apache-2.0): Z-Image''s 6B single-stream DiT distilled to 8 steps without guidance (Decoupled-DMD + DMDR), conditioned by Qwen3-4B, FLUX''s 16-channel VAE; photoreal pictures and legible English and Chinese text. The DiT (Q8_0, 6.7 GiB) and the VAE on the first card, the text encoder (Q8_0, 3.8 GiB) on the second; nothing streamed'
gpus: '0,1'
split: true                      # nextcuda: the DiT and the VAE on the first card, the text encoder on the second
vram_gib: 9.5                    # the first card's at 1024 x 1024 (the DiT's 6.7 GiB, activations and the VAE's); the second's ~4.3
defaults:
  steps: 8
  cfg: 1.0
  sampler: euler
  schedule: shift
  size: 1024x1024
env: {}
