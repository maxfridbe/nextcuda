# Qwen-Image 2.1 Turbo Q8_0 (Viggle v0.3: 6 steps, no guidance; Rust + CUDA)
# model card (model-cards/README.md): what `nextcuda models search | pull` offers and what the registry entry gets.
# Viggle's few-step distill merged into the base transformer (fp32, then Q8_0), the Q8 card's text encoder, projector
# and VAE. It runs on the Rust engine (NC_IMAGE_BACKEND=rust), which samples the distill's own 6 sigmas with the
# size's shift - nextsycl's turbo card's schedule; stable-diffusion.cpp has no way to be given those levels.
id: qwen-image-2.1-turbo-q8
kind: image
arch: qwen-image-2.1
license: qwen-research
commercial: false
license_note: 'Qwen Research Licence: the weights may be used for non-commercial purposes only (research or evaluation); commercial use needs a separate licence from Qwen.'
title: 'Qwen-Image 2.1 Turbo Q8_0 (Viggle v0.3: 6 steps, no guidance; Rust + CUDA)'
about: 'Viggle''s Qwen-Image-2.1 turbo v0.3 (6 steps at cfg 1) merged into the base transformer, then Q8_0; the base model''s Qwen3-VL text encoder, projector and VAE; its 6 sigmas with the size''s shift. The transformer stays on the card (Rust engine): a card with about 11 GiB free'
gpus: '0'
vram_gib: 11.0                 # the Rust engine keeps the 7.2 GiB transformer on the card, with the VAE and 1024x1024's activations
defaults:
  steps: 6
  cfg: 1.0
  sampler: euler
  schedule: shift
  size: 1024x1024
env:
  NC_IMAGE_BACKEND: rust
  NS_QI_SIGMAS: 1,0.9375,0.875,0.75,0.5,0.25
  NS_QI_SIGMA_SHIFT: dynamic
files:
  transformer:
    key: qwen-image-21-turbo-q80
    url: https://huggingface.co/Viggle/Qwen-Image-2.1-viggle-turbo/resolve/009a44a895ef85f7e643c80fdca9543795248867/Qwen-Image-2.1-viggle-turbo-v0.3-6step-Q8_0.gguf
    size: 7687180448
    sha256: f3aaa3a00da202b1295bb2cb8dae0b15172c1e26aaeb805cdc1e4755bd94d64f
    path: qwen-image-2.1/diffusion_models/Qwen-Image-2.1-viggle-turbo-v0.3-6step-Q8_0.gguf
  text-encoder: qwen-image-21-llm-q4km
  llm-vision: qwen-image-21-llm-mmproj
  vae: qwen-image-21-vae
guide: guides/qwen-image-2.1.md
