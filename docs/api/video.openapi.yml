openapi: 3.1.0
info:
  title: nextcuda video studio (nextcuda video serve)
  version: generated
  description: 'A server''s own routes (127.0.0.1; the front door serves its page under /open/<id>/). Generated from its #[route] handlers by `nextcuda gen-api`: do not edit.'
servers:
- url: /
paths:
  /api/gpu:
    get:
      operationId: gpu
      summary: The card's telemetry
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gpu'
        default:
          description: 'an error: the body''s `error` says what'
  /api/summary:
    get:
      operationId: summary
      summary: The rates of the last clips made, what the queue will take, the disk, the running project's totals
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        default:
          description: 'an error: the body''s `error` says what'
  /api/engines:
    get:
      operationId: engines
      summary: The denoisers the engine has
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engines'
        default:
          description: 'an error: the body''s `error` says what'
  /api/canvases:
    get:
      operationId: canvases
      summary: The canvases offered
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canvases'
        default:
          description: 'an error: the body''s `error` says what'
  /api/plan:
    get:
      operationId: plan
      summary: 'The canvas table''s model: the denoisers, canvases, defaults, what a card holds and each GPU''s measured step cost'
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        default:
          description: 'an error: the body''s `error` says what'
  /api/status:
    get:
      operationId: status
      summary: The studio now (as POST /rpc/status)
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          description: 'an error: the body''s `error` says what'
  /api/list:
    get:
      operationId: list
      summary: Every finished clip, newest first
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListRow'
        default:
          description: 'an error: the body''s `error` says what'
  /api/templates:
    get:
      operationId: templates
      summary: The prompt templates
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        default:
          description: 'an error: the body''s `error` says what'
  /api/films:
    get:
      operationId: films
      summary: The joined films, newest first
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Film'
        default:
          description: 'an error: the body''s `error` says what'
  /api/join:
    get:
      operationId: joins
      summary: The films being joined, and joined since the studio started
      tags:
      - page
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Joins'
        default:
          description: 'an error: the body''s `error` says what'
    post:
      operationId: join
      summary: 'Joins a project''s finished clips, in timeline order, into one film (in the background: GET /api/join follows it)'
      tags:
      - page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRef'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinStarted'
        default:
          description: 'an error: the body''s `error` says what'
  /api/timeline:
    get:
      operationId: timeline
      summary: 'A project''s clips in edit order: finished (the newest retry of each number), running, held, queued'
      tags:
      - page
      parameters:
      - name: project
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timeline'
        default:
          description: 'an error: the body''s `error` says what'
  /api/types.ts:
    get:
      operationId: typesTs
      summary: The RPC layer's TypeScript (its types and an rpc() helper)
      tags:
      - page
      responses:
        '200':
          description: the file
          content:
            application/typescript:
              schema:
                type: string
                format: binary
        default:
          description: 'an error: the body''s `error` says what'
  /api/scene:
    get:
      operationId: scene
      summary: A project as a portable scene file (pretty JSON)
      tags:
      - page
      parameters:
      - name: project
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        default:
          description: 'an error: the body''s `error` says what'
  /api/clip:
    get:
      operationId: clip
      summary: 'A clip not made yet, by its label: running, held or queued, with the words it speaks'
      tags:
      - page
      parameters:
      - name: label
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        default:
          description: 'an error: the body''s `error` says what'
  /api/job/{name}:
    get:
      operationId: job
      summary: A finished clip's record
      tags:
      - page
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: the file's name as the link has it
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipRecord'
        default:
          description: 'an error: the body''s `error` says what'
  /thumb/{name}:
    get:
      operationId: thumb
      summary: A finished clip's 240-pixel still, 5 s in (made once, then kept)
      tags:
      - files
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: the file's name as the link has it
      responses:
        '200':
          description: the file
          content:
            image/webp:
              schema:
                type: string
                format: binary
        default:
          description: 'an error: the body''s `error` says what'
  /out/{name}:
    get:
      operationId: out
      summary: 'A clip (mp4, in byte ranges: the player seeks), or its preview while it samples (<clip>.preview.png) and its last frame (<clip>.last.png)'
      tags:
      - files
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: the file's name as the link has it
      - name: Range
        in: header
        required: false
        schema:
          type: string
        description: 'bytes=a-b, bytes=a- or bytes=-n (one span): answered 206 with Content-Range'
      responses:
        '200':
          description: the file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          description: 'an error: the body''s `error` says what'
        '206':
          description: the span asked for
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
  /api/upload:
    post:
      operationId: upload
      summary: 'A reference picture, clip or sound, kept beside the clips (references are named by file there): the body is the file'
      tags:
      - page
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'the file''s own name (its extension says what it is: png, jpg, jpeg, webp, mp4, mov, webm, mkv, wav, mp3, flac, m4a, ogg)'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uploaded'
        default:
          description: 'an error: the body''s `error` says what'
  /api/queue/pause:
    post:
      operationId: queuePause
      summary: Holds the queue, a project or a batch (on), or releases it
      tags:
      - page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldReq'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        default:
          description: 'an error: the body''s `error` says what'
  /api/queue/clear:
    post:
      operationId: queueClear
      summary: Empties the queue
      tags:
      - page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cleared'
        default:
          description: 'an error: the body''s `error` says what'
  /api/scene/import:
    post:
      operationId: sceneImport
      summary: Queues a scene file's clips (all or nothing), as a project, held or not
      tags:
      - page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneImport'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Imported'
        default:
          description: 'an error: the body''s `error` says what'
  /api/gen:
    post:
      operationId: gen
      summary: 'The oldest route: a clip made or queued, its seconds and steps clamped (the RPC refuses them instead) and an unknown te read as teacher; answers the queue position and label, or the job started'
      tags:
      - page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        default:
          description: 'an error: the body''s `error` says what'
components:
  schemas:
    Batch:
      type: object
      properties:
        batch:
          type: string
        clips:
          type: integer
        video_s:
          type: number
        paused:
          type: boolean
      required:
      - batch
      - clips
      - video_s
      - paused
      description: A batch of a project's queued clips
    Canvas:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
        aspect:
          type: string
        note:
          type: string
        mpx:
          type: number
        cost:
          type: number
        default:
          type: boolean
      required:
      - width
      - height
      - aspect
      - note
      - mpx
      - cost
      - default
      description: A canvas the table offers, with its price against 640x480
    Canvases:
      type: object
      properties:
        canvases:
          type: array
          items:
            $ref: '#/components/schemas/Canvas'
      required:
      - canvases
      description: The canvases
    Chain:
      type: object
      properties:
        from:
          anyOf:
          - type: string
          - type: 'null'
          description: 'the clip it follows: an anchor (prev, prev_cam, first, first_cam) or a clip''s name (default prev)'
        context_frames:
          anyOf:
          - type: number
          - type: 'null'
          description: '0 or 17k + 5: the last N frames as a moving keyframe at frame 0 (trim N/2 each side when joining)'
        sound:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'with context_frames: the last N/24 s of sound too (default true)'
        still:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'from''s last frame as first_frame (default: when context_frames is 0)'
        mode:
          anyOf:
          - type: string
          - type: 'null'
          description: video | png | latent
        color_reanchor:
          anyOf:
          - {}
          - type: 'null'
          description: 'exposure_ref: the carried pictures scaled to its brightness (an anchor, or true for from)'
      additionalProperties: true
      description: 'Chaining a clip onto another: what `chain` sets (guide_clip, first_audio(_s), first_frame, chain_mode, exposure_ref; a flat key of the request wins)'
    Cleared:
      type: object
      properties:
        cleared:
          type: integer
      required:
      - cleared
      description: A queue cleared
    Clip:
      type: object
      properties:
        prompt:
          anyOf:
          - type: string
          - type: 'null'
        label:
          anyOf:
          - type: string
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: 'the clip: h3_YYYYMMDD_HHMMSS (once it starts)'
        id:
          anyOf:
          - type: string
          - type: 'null'
          description: the engine's job id
        started:
          anyOf:
          - type: number
          - type: 'null'
          description: unix seconds
        project:
          anyOf:
          - type: string
          - type: 'null'
        seconds:
          anyOf:
          - type: number
          - type: 'null'
        energy_wh:
          anyOf:
          - type: number
          - type: 'null'
        reentrant_id:
          anyOf:
          - type: string
          - type: 'null'
        batch:
          anyOf:
          - type: string
          - type: 'null'
        frames:
          anyOf:
          - type: integer
          - type: 'null'
        steps:
          anyOf:
          - type: integer
          - type: 'null'
        seed:
          anyOf:
          - type: integer
          - type: 'null'
        te:
          anyOf:
          - type: string
          - type: 'null'
          description: teacher | student
        engine:
          anyOf:
          - type: string
          - type: 'null'
        width:
          anyOf:
          - type: integer
          - type: 'null'
        height:
          anyOf:
          - type: integer
          - type: 'null'
        first_frame:
          anyOf:
          - type: string
          - type: 'null'
          description: an anchor or a still's file
        camera:
          anyOf:
          - type: string
          - type: 'null'
        upscale:
          anyOf:
          - type: number
          - type: 'null'
        loras:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: '"path:strength"'
        dialogue:
          anyOf:
          - type: string
          - type: 'null'
          description: '/api/clip: the words spoken, and queued, held or running'
        state:
          anyOf:
          - $ref: '#/components/schemas/ClipState'
          - type: 'null'
      additionalProperties: true
      description: 'A clip''s record: a queue item, the running job, or what /api/gen and /api/clip answer - every generate key as the studio settled it, and what starting it added (the engine''s id, the clip''s name, when it started, its energy)'
    ClipRecord:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Clip'
        times:
          anyOf:
          - type: object
            additionalProperties:
              type: number
          - type: 'null'
        frames:
          anyOf:
          - type: integer
          - type: 'null'
        wall:
          anyOf:
          - type: number
          - type: 'null'
        energy_wh:
          anyOf:
          - type: number
          - type: 'null'
      required:
      - job
      additionalProperties: true
      description: 'A finished clip''s record (`<clip>.json`): the job as made, its stages'' times, frames, wall time, energy'
    ClipRequest:
      type: object
      properties:
        prompt:
          type: string
        seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: 1-15.1, snapped up to 17k + 5 frames; the model is trained on 124-362 frames at 24 fps
        frames:
          anyOf:
          - type: number
          - type: 'null'
          description: 'instead of seconds: exactly 17k + 5 (22-362), else 400 naming the nearest'
        reentrant_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 'idempotent submit: a clip of this id queued, running or made is answered instead'
        chain:
          anyOf:
          - $ref: '#/components/schemas/Chain'
          - type: 'null'
        steps:
          anyOf:
          - type: number
          - type: 'null'
          description: 1-40; below 8 only with a turbo LoRA
        seed:
          anyOf:
          - type: number
          - type: 'null'
        te:
          anyOf:
          - {}
          - type: 'null'
          description: teacher | student (the text encoder)
        label:
          anyOf:
          - {}
          - type: 'null'
          description: '"Name NN/MM: ..." - the NN drives edit order'
        width:
          anyOf:
          - type: number
          - type: 'null'
          description: 256-1344, multiples of 32, width * height <= 1032192
        height:
          anyOf:
          - type: number
          - type: 'null'
        engine:
          anyOf:
          - type: string
          - type: 'null'
          description: 'the denoiser (engines'' quant): INT8 (default), Q6_K, Q4_K_M; REF2VA is chosen by itself for ref_images / ref_videos'
        chain_mode:
          anyOf:
          - type: string
          - type: 'null'
          description: png | video | latent | none
        first_frame:
          anyOf:
          - {}
          - type: 'null'
          description: 'an anchor (prev, prev_cam, first, first_cam: the series'' previous clip or hub, *_cam the same camera only) or a still in the clips directory'
        last_frame:
          anyOf:
          - {}
          - type: 'null'
        exposure_ref:
          anyOf:
          - {}
          - type: 'null'
        first_audio:
          anyOf:
          - {}
          - type: 'null'
        first_audio_s:
          anyOf:
          - {}
          - type: 'null'
        soundtrack:
          anyOf:
          - {}
          - type: 'null'
          description: 'a driving soundtrack (a song: a sound file in the clips directory, video.upload): the clip''s length of it from soundtrack_start is pinned under the whole clip as an audio keyframe, and the picture is made to it (a singer''s mouth to the singing); the clip carries the file''s own sound. Not with first_audio (a chain''s sound is off)'
        soundtrack_start:
          anyOf:
          - type: number
          - type: 'null'
          description: seconds into the soundtrack at the clip's first frame (default 0); a chain's next clip starts where its first carried frame is in the song
        cond_noise_aug:
          anyOf:
          - {}
          - type: 'null'
          description: 'harmful here: decodes as visible confetti'
        camera:
          anyOf:
          - {}
          - type: 'null'
        upscale:
          anyOf:
          - {}
          - type: 'null'
          description: latent upscale at decode, 1.5 = free resolution
        upscaler:
          anyOf:
          - {}
          - type: 'null'
          description: esrgan-general (default) | esrgan-anime | latent
        loras:
          anyOf:
          - type: array
            items: {}
          - type: 'null'
          description: '"path:strength"'
        ref_audios:
          anyOf:
          - type: array
            items: {}
          - type: 'null'
          description: 'at most 3; voices to speak in: <Audio 1>, <Audio 2> ... (files in the clips directory)'
        ref_images:
          anyOf:
          - type: array
            items: {}
          - type: 'null'
          description: at most 9 (Ref2VA), named in the prompt as <Picture i>
        ref_videos:
          anyOf:
          - type: array
            items: {}
          - type: 'null'
          description: at most 3 (Ref2VA), named as <Video k>
        ref_image_size:
          anyOf:
          - {}
          - type: 'null'
          description: match | max
        ref_video_sound:
          anyOf:
          - {}
          - type: 'null'
        te_pictures:
          anyOf:
          - {}
          - type: 'null'
          description: the keyframe pictures shown to the text encoder too (default on)
        guide_clip:
          anyOf:
          - {}
          - type: 'null'
          description: 'motion guide: "<anchor or file>[:frames[:at]]" - the last frames of a clip as one moving keyframe'
        shift_video:
          anyOf:
          - {}
          - type: 'null'
          description: flow shifts (12, 3)
        shift_audio:
          anyOf:
          - {}
          - type: 'null'
        source:
          anyOf:
          - {}
          - type: 'null'
          description: 'masked run: a clip whose latents are kept outside the regenerated part'
        regen:
          anyOf:
          - {}
          - type: 'null'
          description: '"from-to" seconds to regenerate; a source shorter than the clip is extended'
        regen_box:
          anyOf:
          - {}
          - type: 'null'
          description: '"x0,y0,x1,y1" pixels: regenerate only inside'
        control_video:
          anyOf:
          - {}
          - type: 'null'
          description: 'the Fun ControlNet: a control video (canny / depth / HED / MLSD / pose frames), a mask (white: regenerate) over a source video; files in the clips directory'
        control_mask:
          anyOf:
          - {}
          - type: 'null'
        control_source:
          anyOf:
          - {}
          - type: 'null'
        control_strength:
          anyOf:
          - type: number
          - type: 'null'
        control_start:
          anyOf:
          - type: number
          - type: 'null'
        control_end:
          anyOf:
          - type: number
          - type: 'null'
        sampler:
          anyOf:
          - type: string
          - type: 'null'
          description: 'ComfyUI''s sampler and schedule names (none: Euler on the shifted schedule)'
        schedule:
          anyOf:
          - type: string
          - type: 'null'
        project:
          anyOf:
          - type: string
          - type: 'null'
        batch:
          anyOf:
          - type: string
          - type: 'null'
        queue:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'busy without it: 409 busy'
        priority:
          anyOf:
          - type: number
          - type: 'null'
          description: '-9..9: a queued clip goes ahead of lower ones'
      required:
      - prompt
      additionalProperties: true
      description: 'A clip asked for (video.generate''s body, and the legacy /api/gen''s): the studio checks each value and its range'
    ClipState:
      type: string
      enum:
      - done
      - running
      - queued
      - held
      description: Where a clip is
    Disk:
      type: object
      properties:
        path:
          type: string
        total_gb:
          type: number
        used_gb:
          type: number
        free_gb:
          type: number
        pct:
          type: number
      required:
      - path
      - total_gb
      - used_gb
      - free_gb
      - pct
      description: The clips directory's disk
    Done:
      type: object
      properties:
        ok:
          type: boolean
          description: 'true'
      required:
      - ok
      description: the action was done
    EngineInfo:
      type: object
      properties:
        quant:
          type: string
          description: 'the name video.generate''s engine takes: INT8, Q6_K, Q4_K_M, REF2VA (H3''s denoisers), ltx2, ltx2_upscale (LTX-2.5)'
        engine:
          anyOf:
          - type: string
          - type: 'null'
