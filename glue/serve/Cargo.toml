[package]
name = "nextcuda-serve"
description = "The servers: an OpenAI-compatible API over a kind's engine, the prompt cache, telemetry, the HTTP plumbing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nextcuda-core.workspace = true
backplane-scheduler.workspace = true
nextcuda-diffusion.workspace = true
nextcuda-llm.workspace = true
nextcuda-image.workspace = true
nextcuda-audio.workspace = true
nextcuda-model3d.workspace = true
nextcuda-tok.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
# the RPC methods are their handlers: vendor/rpcgen, from vibe-creative-platform (tooling/sync_rpcgen.sh)
rpcgen = { path = "../../vendor/rpcgen", default-features = false }
sha2 = "0.10"
# the speech text pass keeps the spans a model reads itself (its card's annotations: `keep` patterns)
fancy-regex = "0.14"
# image.describe: a picture's size read from its header before it is decoded
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# the front door's https port (tls.rs): rustls over the graviola provider - pure Rust, no build script, no C (aws-lc-rs
# and ring both compile C) -, the certificate made by rcgen with no crypto backend of its own (graviola signs) and a kept
# one read by x509-parser
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
graviola = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
x509-parser = { version = "0.18", default-features = false }
time = "0.3"
